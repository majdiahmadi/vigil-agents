[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "vigil-agents"
version = "0.1.0"
description = "Evidence-grounded multi-agent SOC investigation framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "platformdirs>=4.3,<5",
  "pydantic>=2.9,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
]

[project.scripts]
vigil = "vigil.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["vigil"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

